name: Release (Windows)

# Rebuilds the Windows installer and updates an EXISTING release in place:
# assets with the same name are overwritten (--clobber), the notes are
# replaced, and (optionally) the tag is moved to the commit being built.
# The release itself is never deleted.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to update
        required: true
        default: 1.6.0-beta1
      move_tag:
        description: Point the tag at the commit being built
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag }}
      MOVE_TAG: ${{ inputs.move_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Check the release exists
        shell: bash
        run: gh release view "$TAG" --json tagName,name --jq '"Updating \(.name) (\(.tagName))"'

      - name: Build installer
        # Icons are committed under build/, so electron-builder runs directly.
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Collect assets (same names as the existing release assets)
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item "dist/OwlASO Setup $version.exe" "release-assets/OwlASO.Setup.$version.exe"
          Compress-Archive -Path dist/win-unpacked/* -DestinationPath release-assets/owlaso-unpacked-windows.zip
          Get-ChildItem release-assets | Format-Table Name, Length

      - name: Move tag to this commit
        if: ${{ inputs.move_tag }}
        shell: bash
        run: |
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"

      - name: Overwrite assets and notes
        shell: bash
        run: |
          gh release upload "$TAG" release-assets/* --clobber
          if [ -f .github/release-notes.md ]; then gh release edit "$TAG" --notes-file .github/release-notes.md; fi
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
